name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      node-version:
        description: 'Node.js version to test'
        required: false
        default: '22'
        type: choice
        options:
          - '20'
          - '22'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('[{0}]', inputs.node-version)) || fromJSON('[20, 22]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test 2>&1 | tee test-results.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: test-results.txt
          retention-days: 5